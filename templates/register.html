{% extends "base.html" %}
{% block title %}Sign up — Group of Tushar Restaurant{% endblock %}
{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1 style="font-size: 1.7rem; text-align:center;">Create your account</h1>
        <form method="post">
            <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" required autofocus>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required>
            </div>
            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" type="tel">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" required minlength="6">
                <div class="field-hint">At least 6 characters.</div>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Sign up</button>
        </form>
        <p class="form-foot">Already have an account? <a href="{{ url_for('login') }}" style="color: var(--gold);">Log in</a></p>
    </div>
</div>
{% endblock %}
