{% extends "admin/base_admin.html" %}
{% block title %}Change Admin Password — Admin{% endblock %}
{% block admin_content %}
<div class="section-head">
  <div>
    <span class="hero-eyebrow">Admin Security</span>
    <h1 style="font-size:1.8rem;">🔐 Change Admin Password</h1>
    <p>Change the password for the currently logged-in admin account.</p>
  </div>
</div>
<form method="post" class="form-card" style="max-width:520px;">
  <div class="field"><label for="current_password">Current Password</label><input id="current_password" name="current_password" type="password" required></div>
  <div class="field"><label for="new_password">New Password</label><input id="new_password" name="new_password" type="password" minlength="6" required><div class="field-hint">Minimum 6 characters.</div></div>
  <div class="field"><label for="confirm_password">Confirm New Password</label><input id="confirm_password" name="confirm_password" type="password" minlength="6" required></div>
  <button type="submit" class="btn btn-primary">Change Password</button>
</form>
{% endblock %}
